name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Recreate Clean Android Structure
        run: |
          flutter create exam_attendance --org com.exam.attendance --project-name exam_attendance
          cd exam_attendance
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' android/app/build.gradle
          sed -i 's/android:label="exam_attendance"/android:label="حضور الامتحانات"/' android/app/src/main/AndroidManifest.xml
          cp -r ../lib .
          cp ../pubspec.yaml .
          sed -i 's/intl: .*/intl: any/' pubspec.yaml
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../exam-attendance.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: exam-attendance-app
          path: exam-attendance.apk
